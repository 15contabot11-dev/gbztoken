<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulário - Fortnite Token</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">FORTNITE TOKEN</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link active" href="formulario.html">Formulário</a></li>
                    <li class="nav-item"><a class="nav-link" href="tabela.html">Tabela</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="text-center mb-3">Registre seu progresso</h1>
        <p class="text-center mb-4">Preencha os campos para fazer uma estimativa das suas chances.</p>

        <div class="row justify-content-center">
            <div class="col-lg-7">
                <form id="formulario" class="card p-4">
                    <div class="mb-3">
                        <label for="nickname" class="form-label">Nickname</label>
                        <input type="text" id="nickname" class="form-control" placeholder="Seu nome no jogo">
                    </div>
                    <div class="mb-3">
                        <label for="plataforma" class="form-label">Plataforma</label>
                        <select id="plataforma" class="form-select">
                            <option>PC</option>
                            <option>PlayStation</option>
                            <option>Xbox</option>
                            <option>Nintendo Switch</option>
                            <option>Celular</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="bau" class="form-label">Quantidade de baús abertos</label>
                        <input type="number" id="bau" class="form-control" min="0" value="0" required>
                    </div>
                    <button type="submit" class="btn btn-warning">Calcular estimativa</button>
                    <div id="resultado" class="alert alert-secondary mt-3 mb-0">
                        O resultado aparecerá aqui.
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="text-center py-3">Trabalho escolar — Guia informativo feito por fãs.</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
